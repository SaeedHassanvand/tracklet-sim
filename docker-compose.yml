services:

  redis:
    image: redis:8-alpine
    container_name: tracklet-sim-redis

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - tracklet-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: tracklet-sim

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "8080:8080"

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080

volumes:
  tracklet-redis-data: